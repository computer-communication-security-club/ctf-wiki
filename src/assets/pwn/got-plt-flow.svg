<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 460 300" width="552" height="360" role="img">
<title>GOT/PLT дуудлагын урсгал (lazy binding)</title>
<style>
svg {
  --bg: #f6f7f9; --border: #d5d9e0; --text: #403f53; --muted: #666b78; --box: #8a8f9a;
  --red: #c41a1a; --yellow: #8a5a00; --green: #16794a; --magenta: #a3237a; --cyan: #00707a;
}
@media (prefers-color-scheme: dark) {
  svg {
    --bg: #23262f; --border: #3b404c; --text: #d6deeb; --muted: #8f97a8; --box: #7f8796;
    --red: #ff7373; --yellow: #facc15; --green: #4ade80; --magenta: #d68cf0; --cyan: #22d3ee;
  }
}
.card { fill: var(--bg); stroke: var(--border); }
.mono { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: 13px; }
.sans { font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; font-size: 12px; }
.muted { fill: var(--muted); }
.box { stroke-width: 1.3; }
.code  { stroke: var(--box);     } rect.code  { fill: var(--box);     fill-opacity: .10; }
.plt   { stroke: var(--cyan);    } rect.plt   { fill: var(--cyan);    fill-opacity: .10; }
.got   { stroke: var(--magenta); } rect.got   { fill: var(--magenta); fill-opacity: .10; }
.libc  { stroke: var(--green);   } rect.libc  { fill: var(--green);   fill-opacity: .10; }
.lazy  { stroke: var(--yellow);  } rect.lazy  { fill: var(--yellow);  fill-opacity: .10; }
.tcode { fill: var(--text); } .tplt { fill: var(--cyan); } .tgot { fill: var(--magenta); }
.tlibc { fill: var(--green); } .tlazy { fill: var(--yellow); }
.b { font-weight: 700; }
.arrow { fill: none; stroke: var(--muted); stroke-width: 1.5; }
.ahead { fill: var(--muted); }
.alabel { fill: var(--muted); }
</style>
<rect class="card" x=".5" y=".5" width="459" height="299" rx="6"/>
<rect class="box code" x="24" y="40" width="150" height="46" rx="4"/>
<text class="sans tcode" x="99.0" y="59.5" text-anchor="middle">программын код</text>
<text class="mono tcode b" x="99.0" y="74.5" text-anchor="middle">call puts@plt</text>
<rect class="box plt" x="24" y="130" width="150" height="58" rx="4"/>
<text class="sans tplt b" x="99.0" y="148.0" text-anchor="middle">PLT stub</text>
<text class="mono tplt" x="99.0" y="163.0" text-anchor="middle">puts@plt:</text>
<text class="mono tplt" x="99.0" y="178.0" text-anchor="middle">jmp *[puts@got]</text>
<rect class="box got" x="250" y="130" width="186" height="58" rx="4"/>
<text class="sans tgot b" x="343.0" y="148.0" text-anchor="middle">GOT (хаягийн хүснэгт)</text>
<text class="mono tgot" x="343.0" y="163.0" text-anchor="middle">puts@got:</text>
<text class="mono tgot" x="343.0" y="178.0" text-anchor="middle">→ жинхэнэ хаяг</text>
<rect class="box libc" x="250" y="40" width="186" height="46" rx="4"/>
<text class="sans tlibc b" x="343.0" y="59.5" text-anchor="middle">libc</text>
<text class="mono tlibc" x="343.0" y="74.5" text-anchor="middle">puts: …машин код…</text>
<rect class="box lazy" x="250" y="232" width="186" height="44" rx="4"/>
<text class="sans tlazy" x="343.0" y="250.5" text-anchor="middle">1-р дуудлага: dynamic linker</text>
<text class="sans tlazy" x="343.0" y="265.5" text-anchor="middle">хаягийг олж GOT-д бичнэ</text>
<path class="arrow" d="M99 86 L99 130"/>
<path class="ahead" d="M99 130 L95.0 121.0 L103.0 121.0 z"/>
<text class="sans alabel" x="86" y="112" text-anchor="middle">①</text>
<path class="arrow" d="M174 159 L250 159"/>
<path class="ahead" d="M250 159 L241.0 163.0 L241.0 155.0 z"/>
<text class="sans alabel" x="212" y="152" text-anchor="middle">②  jmp</text>
<path class="arrow" d="M343 130 L343 86"/>
<path class="ahead" d="M343 86 L347.0 95.0 L339.0 95.0 z"/>
<text class="sans alabel" x="None" y="None" text-anchor="middle">③  дараагийн
удаа шууд</text>
<text class="sans alabel" x="398" y="112" text-anchor="middle">③ дараа нь</text>
<path class="arrow" d="M343 232 L343 188" stroke-dasharray="4 3"/>
<path class="ahead" d="M343 188 L347.0 197.0 L339.0 197.0 z"/>
<text class="sans alabel" x="398" y="214" text-anchor="middle">анх удаа</text>
</svg>
