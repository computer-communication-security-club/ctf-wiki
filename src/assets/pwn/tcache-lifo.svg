<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 330" width="600" height="330" role="img">
<title>tcache LIFO: free нь толгойд нэмнэ, malloc нь толгойгоос авна</title>
<style>
svg{--bg:#f6f7f9;--border:#d5d9e0;--text:#403f53;--muted:#666b78;--box:#8a8f9a;--cyan:#00707a;}
@media (prefers-color-scheme:dark){svg{--bg:#23262f;--border:#3b404c;--text:#d6deeb;--muted:#8f97a8;--box:#7f8796;--cyan:#22d3ee;}}
.card{fill:var(--bg);stroke:var(--border);}
.mono{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:13px;}
.sans{font-family:system-ui,sans-serif;font-size:12px;}
.lbl{fill:var(--text);font-weight:700;}.muted{fill:var(--muted);}
.box{fill:var(--box);fill-opacity:.08;stroke:var(--box);stroke-width:1.2;}
.head{fill:var(--cyan);fill-opacity:.10;stroke:var(--cyan);stroke-width:1.4;}
.thead{fill:var(--cyan);}.tbox{fill:var(--text);}.nil{fill:var(--muted);}
.arr{fill:none;stroke:var(--muted);stroke-width:1.5;}
</style>
<rect class="card" x=".5" y=".5" width="599" height="329" rx="6"/>
<text class="sans lbl" x="16" y="30">tcache 0x60 (LIFO): free → толгойд нэмнэ, malloc → толгойгоос авна</text>
<defs><marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="3" orient="auto"><path d="M0,0 L7,3 L0,6" fill="none" stroke="var(--muted)" stroke-width="1.3"/></marker></defs>
<text class="mono lbl" x="16" y="79">① free(A)</text>
<rect class="head" x="168" y="58" width="74" height="34" rx="4"/>
<text class="mono thead" x="205" y="72" text-anchor="middle">tcache</text>
<text class="mono thead" x="205" y="86" text-anchor="middle">0x60</text>
<rect class="box" x="276" y="58" width="74" height="34" rx="4"/>
<text class="mono tbox" x="313" y="79" text-anchor="middle">A</text>
<path class="arr" marker-end="url(#a)" d="M242 75 L272 75"/>
<path class="arr" marker-end="url(#a)" d="M350 75 L380 75"/>
<text class="mono nil" x="384" y="79">∅</text>
<text class="sans muted" x="390" y="79">counts=1</text>
<text class="mono lbl" x="16" y="145">② free(B)</text>
<rect class="head" x="168" y="124" width="74" height="34" rx="4"/>
<text class="mono thead" x="205" y="138" text-anchor="middle">tcache</text>
<text class="mono thead" x="205" y="152" text-anchor="middle">0x60</text>
<rect class="box" x="276" y="124" width="74" height="34" rx="4"/>
<text class="mono tbox" x="313" y="145" text-anchor="middle">B</text>
<path class="arr" marker-end="url(#a)" d="M242 141 L272 141"/>
<rect class="box" x="384" y="124" width="74" height="34" rx="4"/>
<text class="mono tbox" x="421" y="145" text-anchor="middle">A</text>
<path class="arr" marker-end="url(#a)" d="M350 141 L380 141"/>
<path class="arr" marker-end="url(#a)" d="M458 141 L488 141"/>
<text class="mono nil" x="492" y="145">∅</text>
<text class="sans muted" x="498" y="145">counts=2  (B.fd=A)</text>
<text class="mono lbl" x="16" y="211">③ malloc → B</text>
<rect class="head" x="168" y="190" width="74" height="34" rx="4"/>
<text class="mono thead" x="205" y="204" text-anchor="middle">tcache</text>
<text class="mono thead" x="205" y="218" text-anchor="middle">0x60</text>
<rect class="box" x="276" y="190" width="74" height="34" rx="4"/>
<text class="mono tbox" x="313" y="211" text-anchor="middle">A</text>
<path class="arr" marker-end="url(#a)" d="M242 207 L272 207"/>
<path class="arr" marker-end="url(#a)" d="M350 207 L380 207"/>
<text class="mono nil" x="384" y="211">∅</text>
<text class="sans muted" x="390" y="211">B-г буцаав; counts=1</text>
<text class="mono lbl" x="16" y="277">④ malloc → A</text>
<rect class="head" x="168" y="256" width="74" height="34" rx="4"/>
<text class="mono thead" x="205" y="270" text-anchor="middle">tcache</text>
<text class="mono thead" x="205" y="284" text-anchor="middle">0x60</text>
<path class="arr" marker-end="url(#a)" d="M242 273 L272 273"/>
<text class="mono nil" x="276" y="277">∅</text>
<text class="sans muted" x="282" y="277">A-г буцаав; counts=0</text>
</svg>