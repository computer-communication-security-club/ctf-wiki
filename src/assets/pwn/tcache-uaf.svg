<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 660 470" width="660" height="470" role="img">
<title>tcache poisoning via use-after-free: free, free, malloc</title>
<style>
svg{--bg:#f6f7f9;--border:#d5d9e0;--text:#403f53;--muted:#666b78;--box:#8a8f9a;--red:#c41a1a;--cyan:#00707a;}
@media (prefers-color-scheme:dark){svg{--bg:#23262f;--border:#3b404c;--text:#d6deeb;--muted:#8f97a8;--box:#7f8796;--red:#ff7373;--cyan:#22d3ee;}}
.card{fill:var(--bg);stroke:var(--border);}
.mono{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:13px;}
.sans{font-family:system-ui,-apple-system,"Segoe UI",sans-serif;font-size:12px;}
.lbl{fill:var(--text);font-weight:700;}.muted{fill:var(--muted);}
.box{fill:var(--box);fill-opacity:.08;stroke:var(--box);stroke-width:1.2;}
.head{fill:var(--cyan);fill-opacity:.10;stroke:var(--cyan);stroke-width:1.4;}
.poison{fill:var(--red);fill-opacity:.10;stroke:var(--red);stroke-width:1.4;}
.thead{fill:var(--cyan);}.tbox{fill:var(--text);}.tpois{fill:var(--red);font-weight:700;}
.arr{fill:none;stroke:var(--muted);stroke-width:1.5;}
.uaf{fill:none;stroke:var(--red);stroke-width:1.4;stroke-dasharray:4 3;}
.nil{fill:var(--muted);}.red{fill:var(--red);}
</style>
<rect class="card" x=".5" y=".5" width="659" height="469" rx="6"/>
<text class="sans lbl" x="16" y="28">tcache 0x60 (LIFO) — free нь толгойд нэмнэ, malloc нь толгойгоос авна</text>
<defs><marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="3" orient="auto"><path d="M0,0 L7,3 L0,6" fill="none" stroke="var(--muted)" stroke-width="1.3"/></marker><marker id="r" markerWidth="8" markerHeight="8" refX="7" refY="3" orient="auto"><path d="M0,0 L7,3 L0,6" fill="none" stroke="var(--red)" stroke-width="1.3"/></marker></defs>
<text class="mono lbl" x="16" y="81">① free(C)</text>
<rect class="head" x="150" y="60" width="74" height="34" rx="4"/>
<text class="mono thead" x="187" y="74" text-anchor="middle">tcache</text>
<text class="mono thead" x="187" y="88" text-anchor="middle">0x60</text>
<rect class="box" x="260" y="60" width="74" height="34" rx="4"/>
<text class="mono tbox" x="297" y="81" text-anchor="middle">C</text>
<path class="arr" marker-end="url(#a)" d="M224 77 L256 77"/>
<path class="arr" marker-end="url(#a)" d="M334 77 L366 77"/>
<text class="mono nil" x="370" y="81">∅</text>
<text class="sans muted" x="150" y="112">C tcache-д орлоо</text>
<text class="mono lbl" x="16" y="161">② free(D)</text>
<rect class="head" x="150" y="140" width="74" height="34" rx="4"/>
<text class="mono thead" x="187" y="154" text-anchor="middle">tcache</text>
<text class="mono thead" x="187" y="168" text-anchor="middle">0x60</text>
<rect class="box" x="260" y="140" width="74" height="34" rx="4"/>
<text class="mono tbox" x="297" y="161" text-anchor="middle">D</text>
<path class="arr" marker-end="url(#a)" d="M224 157 L256 157"/>
<rect class="box" x="370" y="140" width="74" height="34" rx="4"/>
<text class="mono tbox" x="407" y="161" text-anchor="middle">C</text>
<path class="arr" marker-end="url(#a)" d="M334 157 L366 157"/>
<path class="arr" marker-end="url(#a)" d="M444 157 L476 157"/>
<text class="mono nil" x="480" y="161">∅</text>
<text class="mono red" x="486" y="161">notes[3] ⟲</text>
<path class="uaf" marker-end="url(#r)" d="M484 157 C 460 157, 327 126, 297 138"/>
<text class="sans muted" x="150" y="192">D → C → ∅.  notes[3] ХЭВ ЗААНА (dangling)</text>
<text class="mono lbl" x="16" y="241">③ edit(D)</text>
<rect class="head" x="150" y="220" width="74" height="34" rx="4"/>
<text class="mono thead" x="187" y="234" text-anchor="middle">tcache</text>
<text class="mono thead" x="187" y="248" text-anchor="middle">0x60</text>
<rect class="box" x="260" y="220" width="74" height="34" rx="4"/>
<text class="mono tbox" x="297" y="241" text-anchor="middle">D</text>
<path class="arr" marker-end="url(#a)" d="M224 237 L256 237"/>
<rect class="poison" x="370" y="220" width="74" height="34" rx="4"/>
<text class="mono tpois" x="407" y="241" text-anchor="middle">&amp;notes</text>
<path class="arr" marker-end="url(#a)" d="M334 237 L366 237"/>
<text class="mono red" x="486" y="241">notes[3] ⟲</text>
<path class="uaf" marker-end="url(#r)" d="M484 237 C 460 237, 327 206, 297 218"/>
<text class="sans muted" x="150" y="272">dangling notes[3]-ээр D.fd-г дарж poison</text>
<text class="mono lbl" x="16" y="321">④ malloc</text>
<rect class="head" x="150" y="300" width="74" height="34" rx="4"/>
<text class="mono thead" x="187" y="314" text-anchor="middle">tcache</text>
<text class="mono thead" x="187" y="328" text-anchor="middle">0x60</text>
<rect class="poison" x="260" y="300" width="74" height="34" rx="4"/>
<text class="mono tpois" x="297" y="321" text-anchor="middle">&amp;notes</text>
<path class="arr" marker-end="url(#a)" d="M224 317 L256 317"/>
<text class="sans muted" x="150" y="352">D-г буцаав; толгой = &amp;notes</text>
<text class="mono lbl" x="16" y="401">⑤ malloc</text>
<rect class="poison" x="150" y="380" width="74" height="34" rx="4"/>
<text class="mono tpois" x="187" y="401" text-anchor="middle">&amp;notes</text>
<text class="sans muted" x="150" y="432">&amp;notes-ийг буцаав → дурын хаяг!</text>
</svg>