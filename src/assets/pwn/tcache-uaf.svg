<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 660 512" width="660" height="512" role="img">
<title>tcache poisoning via use-after-free: free, free, malloc</title>
<style>
svg{--bg:#f6f7f9;--border:#d5d9e0;--text:#403f53;--muted:#666b78;--box:#8a8f9a;--red:#c41a1a;--cyan:#00707a;}
@media (prefers-color-scheme:dark){svg{--bg:#23262f;--border:#3b404c;--text:#d6deeb;--muted:#8f97a8;--box:#7f8796;--red:#ff7373;--cyan:#22d3ee;}}
.card{fill:var(--bg);stroke:var(--border);}
.mono{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:13px;}
.sans{font-family:system-ui,-apple-system,"Segoe UI",sans-serif;font-size:12px;}
.lbl{fill:var(--text);font-weight:700;}.muted{fill:var(--muted);}
.box{fill:var(--box);fill-opacity:.08;stroke:var(--box);stroke-width:1.2;}
.head{fill:var(--cyan);fill-opacity:.10;stroke:var(--cyan);stroke-width:1.4;}
.poison{fill:var(--red);fill-opacity:.10;stroke:var(--red);stroke-width:1.4;}
.thead{fill:var(--cyan);}.tbox{fill:var(--text);}.tpois{fill:var(--red);font-weight:700;}
.arr{fill:none;stroke:var(--muted);stroke-width:1.5;}
.uaf{fill:none;stroke:var(--red);stroke-width:1.4;stroke-dasharray:4 3;}
.nil{fill:var(--muted);}.red{fill:var(--red);}
</style>
<rect class="card" x=".5" y=".5" width="659" height="511" rx="6"/>
<text class="sans lbl" x="16" y="30">tcache 0x60 (LIFO) — free нь толгойд нэмнэ, malloc нь толгойгоос авна</text>
<defs><marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="3" orient="auto"><path d="M0,0 L7,3 L0,6" fill="none" stroke="var(--muted)" stroke-width="1.3"/></marker><marker id="r" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L7,3 L0,6" fill="none" stroke="var(--red)" stroke-width="1.3"/></marker></defs>
<text class="mono lbl" x="16" y="85">① free(C)</text>
<rect class="head" x="150" y="64" width="74" height="34" rx="4"/>
<text class="mono thead" x="187" y="78" text-anchor="middle">tcache</text>
<text class="mono thead" x="187" y="92" text-anchor="middle">0x60</text>
<rect class="box" x="260" y="64" width="74" height="34" rx="4"/>
<text class="mono tbox" x="297" y="85" text-anchor="middle">C</text>
<path class="arr" marker-end="url(#a)" d="M224 81 L256 81"/>
<path class="arr" marker-end="url(#a)" d="M334 81 L366 81"/>
<text class="mono nil" x="370" y="85">∅</text>
<text class="sans muted" x="150" y="116">C tcache-д орлоо</text>
<text class="mono lbl" x="16" y="173">② free(D)</text>
<rect class="head" x="150" y="152" width="74" height="34" rx="4"/>
<text class="mono thead" x="187" y="166" text-anchor="middle">tcache</text>
<text class="mono thead" x="187" y="180" text-anchor="middle">0x60</text>
<rect class="box" x="260" y="152" width="74" height="34" rx="4"/>
<text class="mono tbox" x="297" y="173" text-anchor="middle">D</text>
<path class="arr" marker-end="url(#a)" d="M224 169 L256 169"/>
<rect class="box" x="370" y="152" width="74" height="34" rx="4"/>
<text class="mono tbox" x="407" y="173" text-anchor="middle">C</text>
<path class="arr" marker-end="url(#a)" d="M334 169 L366 169"/>
<path class="arr" marker-end="url(#a)" d="M444 169 L476 169"/>
<text class="mono nil" x="480" y="173">∅</text>
<text class="mono red" x="297" y="142" text-anchor="middle">⟲ notes[3]</text>
<path class="uaf" marker-end="url(#r)" d="M297 145 L297 151"/>
<text class="sans muted" x="150" y="204">D → C → ∅.  notes[3] чөлөөлсөн D-г хэвээр заана (dangling)</text>
<text class="mono lbl" x="16" y="261">③ edit(D)</text>
<rect class="head" x="150" y="240" width="74" height="34" rx="4"/>
<text class="mono thead" x="187" y="254" text-anchor="middle">tcache</text>
<text class="mono thead" x="187" y="268" text-anchor="middle">0x60</text>
<rect class="box" x="260" y="240" width="74" height="34" rx="4"/>
<text class="mono tbox" x="297" y="261" text-anchor="middle">D</text>
<path class="arr" marker-end="url(#a)" d="M224 257 L256 257"/>
<rect class="poison" x="370" y="240" width="74" height="34" rx="4"/>
<text class="mono tpois" x="407" y="261" text-anchor="middle">&amp;notes</text>
<path class="arr" marker-end="url(#a)" d="M334 257 L366 257"/>
<text class="mono red" x="297" y="230" text-anchor="middle">⟲ notes[3]</text>
<path class="uaf" marker-end="url(#r)" d="M297 233 L297 239"/>
<text class="sans muted" x="150" y="292">dangling notes[3]-ээр D.fd-г дарж poison</text>
<text class="mono lbl" x="16" y="349">④ malloc</text>
<rect class="head" x="150" y="328" width="74" height="34" rx="4"/>
<text class="mono thead" x="187" y="342" text-anchor="middle">tcache</text>
<text class="mono thead" x="187" y="356" text-anchor="middle">0x60</text>
<rect class="poison" x="260" y="328" width="74" height="34" rx="4"/>
<text class="mono tpois" x="297" y="349" text-anchor="middle">&amp;notes</text>
<path class="arr" marker-end="url(#a)" d="M224 345 L256 345"/>
<text class="sans muted" x="150" y="380">D-г буцаав; толгой = &amp;notes</text>
<text class="mono lbl" x="16" y="437">⑤ malloc</text>
<rect class="poison" x="150" y="416" width="74" height="34" rx="4"/>
<text class="mono tpois" x="187" y="437" text-anchor="middle">&amp;notes</text>
<text class="sans muted" x="150" y="468">&amp;notes-ийг буцаав → дурын хаяг!</text>
</svg>