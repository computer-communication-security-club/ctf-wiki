<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 448 330" width="537.6" height="396" role="img">
<title>ret2text: функцийн stack frame</title>
<style>
svg {
  --bg: #f6f7f9; --border: #d5d9e0; --text: #403f53; --muted: #666b78; --box: #8a8f9a;
  --red: #c41a1a; --yellow: #8a5a00; --green: #16794a; --magenta: #a3237a; --cyan: #00707a;
}
@media (prefers-color-scheme: dark) {
  svg {
    --bg: #23262f; --border: #3b404c; --text: #d6deeb; --muted: #8f97a8; --box: #7f8796;
    --red: #ff7373; --yellow: #facc15; --green: #4ade80; --magenta: #d68cf0; --cyan: #22d3ee;
  }
}
.card { fill: var(--bg); stroke: var(--border); }
.mono { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, "Liberation Mono", monospace; font-size: 14px; }
.sans { font-family: system-ui, -apple-system, "Segoe UI", Roboto, "Noto Sans", sans-serif; font-size: 13px; }
.dir { fill: var(--text); font-weight: 700; }
.muted { fill: var(--muted); }
.box { stroke: var(--box); stroke-width: 1.2; }
.ret { fill: var(--red); } .rbp { fill: var(--yellow); } .pad { fill: var(--green); } .sc { fill: var(--magenta); }
rect.ret, rect.rbp, rect.pad, rect.sc { fill-opacity: .07; }
.b { font-weight: 700; }
.line { fill: none; stroke: var(--cyan); stroke-width: 1.6; }
.bracket { fill: none; stroke: var(--red); stroke-width: 1.4; }
.head { fill: var(--cyan); }
.cyan { fill: var(--cyan); }
</style>
<rect class="card" x=".5" y=".5" width="447" height="329" rx="6"/>
<text class="sans dir" x="48" y="30">↑ их хаяг</text>
<text class="sans dir" x="48" y="302">↓ бага хаяг</text>
<rect class="box ret" x="48" y="44" width="190" height="50"/>
<text class="mono ret b" x="60" y="74.0">return address</text>
<text class="mono ret" x="228" y="74.0" text-anchor="end">8 B</text>
<rect class="box rbp" x="48" y="94" width="190" height="50"/>
<text class="mono rbp" x="60" y="124.0">saved rbp</text>
<text class="mono rbp" x="228" y="124.0" text-anchor="end">8 B</text>
<rect class="box pad" x="48" y="144" width="190" height="132"/>
<text class="mono pad" x="60" y="215.0">char buf[...]</text>
<text class="mono ret b" x="252" y="67">← rbp + 8</text>
<text class="sans ret b" x="270" y="84">бид үүнийг дарж бичнэ</text>
<text class="mono rbp" x="252" y="124">← rbp</text>
<text class="mono pad" x="252" y="256">← buf</text>
<text class="sans pad" x="270" y="273">өгөгдөл эндээс эхэлнэ</text>
<path class="line" d="M30 268 V60"/>
<path class="head" d="M30 52 l-5 9 h10 z"/>
<text class="sans cyan b" x="22" y="160.0" text-anchor="middle" transform="rotate(-90 22 160.0)">gets() энэ чиглэлд бичнэ</text>
</svg>
